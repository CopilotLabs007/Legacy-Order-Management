<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legacy Order Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f6f9; color: #333; }
        header { background: #2c3e50; color: #fff; padding: 20px 40px; }
        header h1 { font-size: 1.5rem; }
        header p { font-size: 0.85rem; color: #95a5a6; margin-top: 4px; }
        main { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        h2 { margin-bottom: 16px; color: #2c3e50; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .product-card {
            background: #fff; border-radius: 8px; padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.15s;
        }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
        .product-card h3 { font-size: 1.1rem; margin-bottom: 8px; }
        .product-card .category { font-size: 0.75rem; background: #3498db; color: #fff; padding: 2px 8px; border-radius: 12px; display: inline-block; margin-bottom: 10px; }
        .product-card .description { font-size: 0.85rem; color: #666; margin-bottom: 12px; }
        .product-card .details { display: flex; justify-content: space-between; align-items: center; }
        .product-card .price { font-size: 1.2rem; font-weight: bold; color: #27ae60; }
        .product-card .stock { font-size: 0.8rem; color: #888; }
        .product-card .sku { font-size: 0.75rem; color: #aaa; margin-top: 8px; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .error { text-align: center; padding: 40px; color: #e74c3c; }
    </style>
</head>
<body>
    <header>
        <h1>Legacy Order Management System</h1>
        <p>Spring Boot 1.5 &middot; Java 8 &middot; JDBC &middot; H2 Database</p>
    </header>
    <main>
        <h2>Products</h2>
        <div id="product-list" class="loading">Loading products...</div>
    </main>
    <script>
        fetch('/api/products')
            .then(function(response) { return response.json(); })
            .then(function(products) {
                var container = document.getElementById('product-list');
                if (products.length === 0) {
                    container.innerHTML = '<p>No products found.</p>';
                    return;
                }
                container.className = 'product-grid';
                container.innerHTML = products.map(function(p) {
                    return '<div class="product-card">' +
                        '<h3>' + escapeHtml(p.name) + '</h3>' +
                        '<span class="category">' + escapeHtml(p.category) + '</span>' +
                        '<p class="description">' + escapeHtml(p.description) + '</p>' +
                        '<div class="details">' +
                            '<span class="price">$' + p.price.toFixed(2) + '</span>' +
                            '<span class="stock">' + p.stockQuantity + ' in stock</span>' +
                        '</div>' +
                        '<p class="sku">SKU: ' + escapeHtml(p.sku) + '</p>' +
                    '</div>';
                }).join('');
            })
            .catch(function(err) {
                document.getElementById('product-list').className = 'error';
                document.getElementById('product-list').textContent = 'Failed to load products: ' + err.message;
            });

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }
    </script>
</body>
</html>
